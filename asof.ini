; asof, checked by asof.
;
; Only the README makes claims here. The package source is full of example
; markers that document the syntax, and those are not claims about anything.

[asof]
include = README.md, QA.md

[source-lines]
run = python tools/facts.py source-lines
why = Everything in the repo, tests included. The point of the number is that
      the tool stays small enough to read in an afternoon, so it is worth watching.

[test-count]
run = python tools/facts.py test-count
why = Asked of unittest, not grepped for.

[dependencies]
run = python tools/facts.py dependencies
why = Zero is a feature. If this ever drifts upward it should be a decision,
      not a surprise.

[qa-probes]
run = python tools/facts.py qa-probes
why = Hostile inputs the adversarial sweep covers. If this falls, coverage was
      removed rather than the code being made simpler.

[qa-invariants]
run = python tools/facts.py qa-invariants
why = Properties held across every one of those inputs.

[timeout-bug]
every = 365d
why = Measured by hand: a 1s timeout against a 30s sleep returned in ~1.2s after
      the process-group fix, and in 30s before it. Re-measure if the subprocess
      handling in core.run_command changes.

[suggest-before]
every = 180d
why = Candidates asof suggest proposed on calibration-ledger before HTML code
      blocks were skipped. Needs that repo cloned, so CI cannot settle it.

[suggest-after]
every = 180d
why = The same count afterwards. The pair is the measurement; update both or
      neither.
