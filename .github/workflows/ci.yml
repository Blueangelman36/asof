name: ci

on:
  push:
  pull_request:
  schedule:
    # Monday morning: nothing has changed, but time has passed, and time is
    # the only thing that makes a manual claim go stale.
    - cron: "0 8 * * 1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v

      - name: Adversarial sweep
        # Different question from the tests: never a traceback, never a quiet
        # exit 0, never a write from a read-only command.
        run: python qa/sweep.py

  claims:
    # The README's own numbers, checked by the tool the README describes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Numbers a machine can settle
        run: python -m asof check
      - name: Numbers a person must settle
        if: always()
        run: python -m asof check --no-run --fail-on stale

  single-file:
    # The zipapp is how asof reaches a repo that will not pip install it, so
    # it is built and exercised on every push rather than at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python tools/build_pyz.py
      - name: It runs with nothing installed
        run: |
          mkdir -p /tmp/probe
          printf 'We have 47 things. <!-- asof:things -->
' > /tmp/probe/README.md
          printf '52 things. <!-- asof:things -->
' > /tmp/probe/docs.md
          python dist/asof.pyz -C /tmp/probe check && exit 1
          echo "caught the split, as it should"
      - uses: actions/upload-artifact@v4
        with:
          name: asof-pyz
          path: dist/asof.pyz
