name: Release

# A version tag produces two things, independently:
#
#   - a GitHub release with asof.pyz attached: the one-file build, runnable with
#     no install. Needs no setup.
#   - the package on PyPI, through trusted publishing. Needs the one-time setup
#     in docs/RELEASING.md; until then that job fails and nothing else does.
#
# Nothing here runs on a normal push.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests must pass before anything is built
        run: python -m unittest discover -s tests -t .

      # A tag that disagrees with the code publishes a version number that
      # means nothing, and PyPI never lets that number be used again.
      - name: The tag, the package and the module agree on the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          module=$(python -c "import asof; print(asof.__version__)")
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$module" ] || [ "$tag" != "$declared" ]; then
            echo "::error::tag v$tag, asof.__version__ $module, pyproject.toml $declared"
            exit 1
          fi

      - name: Wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error

      - name: The single-file build
        run: |
          python tools/build_pyz.py
          mkdir -p pyz && mv dist/asof.pyz pyz/
          python pyz/asof.pyz --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: asof-pyz
          path: pyz/asof.pyz
          if-no-files-found: error

  github-release:
    name: attach asof.pyz to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating the release, and nothing else
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: asof-pyz
          path: out
      - name: Checksum
        run: cd out && sha256sum asof.pyz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # the OIDC token trusted publishing uses, and nothing else
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
