[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# `asof` on PyPI is an unrelated project; the command is still `asof`.
name = "asof-claims"
version = "0.4.1"
description = "Every number in your docs is a claim about a moment that has already passed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["documentation", "docs", "drift", "staleness", "ci", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
asof = "asof.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/Blueangelman36/asof"
Source = "https://github.com/Blueangelman36/asof"

[tool.setuptools]
packages = ["asof"]

[tool.setuptools.package-data]
asof = ["skill.md"]
